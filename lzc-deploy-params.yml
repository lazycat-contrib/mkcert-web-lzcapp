params:
  - id: admin_username
    type: string
    name: "Admin Username"
    description: "Username for the mkcert Web UI administrator"
    default_value: "admin"

  - id: admin_password
    type: secret
    name: "Admin Password"
    description: "Password for the mkcert Web UI administrator"
    default_value: "$random(len=20)"

locales:
  zh:
    admin_username:
      name: "管理员帐号"
      description: "管理员帐号的登录名称"

    admin_password:
      name: "管理员密码"
      description: "管理员登录密码"
