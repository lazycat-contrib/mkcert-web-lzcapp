package: lazycat.community.app.mkcert-web
name: mkcert Web UI
version: 2.0.0
min_os_version: 1.3.8
description: Web based user interface for mkcert CLI internal CA
homepage: https://github.com/jeffcaldwellca/mkcertWeb
author: jeffcaldwellca
application:
    subdomain: mkcert-web
    background_task: true
    public_path:
        - /
    routes:
        - /=http://mkcert-web:3000
services:
    mkcert-web:
        # czyt/mkcertweb:v2.0.0
        image: registry.lazycat.cloud/czyt/czyt/mkcertweb:3f19328e48444082
        environment:
            # Server Configuration
            - PORT=3000
            - HTTPS_PORT=3443
            - HOST=0.0.0.0
            # SSL/HTTPS Configuration
            - ENABLE_HTTPS=false
            # Application Configuration
            - NODE_ENV=production
            - DEFAULT_THEME=dark
            # Authentication Configuration (disabled by default)
            - ENABLE_AUTH=true
            - AUTH_USERNAME={{.U.admin_username}}
            - AUTH_PASSWORD={{.U.admin_password}}
            - SESSION_SECRET={{stable_secret "mkcert-web#session_secret" | substr 0 32}}

            # Rate Limiting Configuration
            - CLI_RATE_LIMIT_WINDOW=900000 # CLI operations window (15 minutes)
            - CLI_RATE_LIMIT_MAX=10 # Max CLI operations per window
            - API_RATE_LIMIT_WINDOW=900000 # API requests window (15 minutes)
            - API_RATE_LIMIT_MAX=100 # Max API requests per window
            - AUTH_RATE_LIMIT_WINDOW=900000 # Auth attempts window (15 minutes)
            - AUTH_RATE_LIMIT_MAX=5 # Max auth attempts per window
        binds:
            - /lzcapp/var/certificates:/app/certificates
            - /lzcapp/var/data:/app/data
        setup_script: |
            chown -R nodejs:nodejs /app/certificates
            chown -R nodejs:nodejs /app/data
