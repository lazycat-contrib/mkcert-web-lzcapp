version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: output/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: mkcert-web

build:
  run_buildscript: false

images:
  - id: mkcert-web
    target: service
    service: mkcert-web
    source: ghcr.io/jeffcaldwellca/mkcertweb
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: mkcert Web UI
    summary: 由 GitHub Actions 自动发布
